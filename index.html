<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans TC', sans-serif; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(60px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOutLeft {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(-60px); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.3); }
      50% { opacity: 1; transform: scale(1.05); }
      70% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-float-delay-1 { animation: float 3.5s ease-in-out 0.5s infinite; }
    .animate-float-delay-2 { animation: float 4s ease-in-out 1s infinite; }
    .animate-float-delay-3 { animation: float 3.2s ease-in-out 1.5s infinite; }
    .animate-breathe { animation: breathe 3s ease-in-out infinite; }
    .animate-fadeInUp { animation: fadeInUp 0.6s ease-out both; }
    .animate-slideInRight { animation: slideInRight 0.4s ease-out both; }
    .animate-slideOutLeft { animation: slideOutLeft 0.3s ease-out both; }
    .animate-pulse-soft { animation: pulse 2s ease-in-out infinite; }
    .animate-bounceIn { animation: bounceIn 0.8s ease-out both; }

    .shimmer-bg {
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    .glass {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .glass-strong {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #fb923c, #f59e0b, #fb923c);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .option-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .option-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(251, 146, 60, 0.25);
    }
    .option-btn:active {

    }

    .hero-glow {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 146, 60, 0.3) 0%, transparent 70%);

      border-radius: 50%;

      filter: blur(40px);
      z-index: 0;

    /* ============================================================
       12 QUESTIONS
       Q1-Q4: E/I dimension
       Q5-Q8: T/F dimension
       Q9-Q12: J/P dimension
    ============================================================ */
    const QUESTIONS = [
      // === E/I 題組 (Q1-Q4) ===
      {
        id: 1,
        dimension: 'EI',
        emoji: '🏪',
        question: '走進便利商店，你的第一反應是？',
        options: [
          { text: '跟熟識的店員打招呼，順便看有沒有新奇的東西', value: 'E' },
          { text: '默默走向常逛的商品區，挑選完迅速結帳', value: 'I' },
        ],
      },
      {
        id: 2,
        dimension: 'EI',
        emoji: '🎉',
        question: '朋友突然揪你週末去一個你沒去過的市集，你的反應是？',
        options: [
          { text: '太好了！馬上答應，還問能不能多揪幾個人', value: 'E' },
          { text: '先看看活動內容跟人數，確認自己有足夠的能量再決定', value: 'I' },
        ],
      },
      {
        id: 3,
        dimension: 'EI',
        emoji: '💬',
        question: '工作群組裡有人拋出一個新點子，你會？',
        options: [
          { text: '立刻跳出來回應，分享自己的想法和延伸', value: 'E' },

        ],
      },
      {
        id: 4,
        dimension: 'EI',
        emoji: '🔋',
        question: '忙碌了一整天，你最想要的充電方式是？',

          { text: '約朋友出門吃飯聊天，越聊越有精神', value: 'E' },

      {
        id: 7,
        dimension: 'TF',
        emoji: '📊',
        question: '你要決定店裡要不要引進一款新商品，你的判斷依據是？',
        options: [
          { text: '看數據：市場趨勢、毛利率、競品分析，數字說了算', value: 'T' },

        ],
      },
      {
        id: 8,
        dimension: 'TF',
        emoji: '😢',
        question: '一個朋友跟你說他最近壓力很大，你第一反應是？',

    /* ============================================================
       MAIN COMPONENT
    ============================================================ */
    function FounderLifeQuiz() {
      const [stage, setStage] = useState('start'); // start | quiz | result
      const [step, setStep] = useState(0);
      const [scores, setScores] = useState({ E: 0, I: 0, T: 0, F: 0, J: 0, P: 0 });
      const [transitioning, setTransitioning] = useState(false);
      const [slideDirection, setSlideDirection] = useState('in');
      const [copied, setCopied] = useState(false);
      const [resultKey, setResultKey] = useState(null);

      const resetQuiz = useCallback(() => {
        setStage('start');
        setStep(0);
        setScores({ E: 0, I: 0, T: 0, F: 0, J: 0, P: 0 });
        setTransitioning(false);
        setSlideDirection('in');
        setCopied(false);
        setResultKey(null);
      }, []);

      const computeResult = useCallback((finalScores) => {
        const ei = finalScores.E >= finalScores.I ? 'E' : 'I';
        const tf = finalScores.T >= finalScores.F ? 'T' : 'F';
        const jp = finalScores.J >= finalScores.P ? 'J' : 'P';
        return ei + tf + jp;
      }, []);

      const handleOptionClick = useCallback((value) => {
        if (transitioning) return;
        setTransitioning(true);
        setSlideDirection('out');

        const newScores = { ...scores, [value]: scores[value] + 1 };
        setScores(newScores);

        setTimeout(() => {
          if (step < QUESTIONS.length - 1) {
            setStep(step + 1);
            setSlideDirection('in');
            setTimeout(() => setTransitioning(false), 400);
          } else {
            const key = computeResult(newScores);
            setResultKey(key);
            setStage('result');
            setTransitioning(false);
          }
        }, 300);
      }, [transitioning, scores, step, computeResult]);

      const handleShare = useCallback(async () => {
        try {
          await navigator.clipboard.writeText(window.location.href);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      }, []);

      const progress = ((step + 1) / QUESTIONS.length) * 100;

      // ==================== START PAGE ====================
      if (stage === 'start') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-amber-100 flex items-center justify-center p-4">
            <div className="w-full max-w-md">
              <div className="glass-strong rounded-3xl shadow-xl shadow-orange-200/50 p-8 text-center relative overflow-hidden">
                {/* Decorative floating emojis */}
                <div className="absolute top-4 left-4 text-2xl animate-float opacity-60">💼</div>
                <div className="absolute top-8 right-6 text-xl animate-float-delay-1 opacity-60">📈</div>
                <div className="absolute bottom-16 left-6 text-xl animate-float-delay-2 opacity-60">💡</div>
                <div className="absolute bottom-20 right-4 text-2xl animate-float-delay-3 opacity-60">🚀</div>

                {/* Logo */}
                <div className="mb-4 animate-fadeInUp" style={{ animationDelay: '0.1s' }}>

                    src="LOGO.png" 
                    alt="Pocket Store Logo" 
                    className="w-36 h-auto mx-auto drop-shadow-lg"
                  />
                </div>

                {/* Hero character */}
                <div className="relative inline-block mb-6 animate-fadeInUp" style={{ animationDelay: '0.2s' }}>
                  <div className="hero-glow animate-breathe" style={{ top: '50%', left: '50%', transform: 'translate(-50%, -50%)' }}></div>
                  <img 
                    src="主頁_黑墨鏡.png" 
                    alt="Boss Character" 
                    className="w-48 h-48 object-contain relative z-10 animate-float drop-shadow-2xl"
                  />
                </div>

                {/* Title */}
                <h1 className="text-3xl font-black text-stone-800 mb-2 animate-fadeInUp" style={{ animationDelay: '0.3s' }}>
                  探索你的靈魂創業人物
                </h1>
                <p className="text-stone-500 mb-2 animate-fadeInUp" style={{ animationDelay: '0.4s' }}>
                  12 道日常情境題，找出你的創業 DNA 🧬
                </p>
                <p className="text-sm text-stone-400 mb-8 animate-fadeInUp" style={{ animationDelay: '0.45s' }}>
                  走進便利商店的那一刻，你的創業人格就已經藏不住了
                </p>

                {/* Preview character emojis */}
                <div className="flex justify-center gap-3 mb-8 animate-fadeInUp" style={{ animationDelay: '0.5s' }}>
                  {['🦁', '🦊', '🐕', '🦜', '🦉', '🐱', '🐺', '🦄'].map((e, i) => (
                    <span 
                      key={i} 
                      className="text-2xl"
                      style={{ animation: `float ${3 + i * 0.3}s ease-in-out ${i * 0.2}s infinite` }}
                    >
                      {e}
                    </span>
                  ))}
                </div>

                {/* CTA button */}
                <button
                  id="start-btn"
                  onClick={() => { setStage('quiz'); setStep(0); }}
                  className="animate-fadeInUp w-full py-4 rounded-2xl text-white font-bold text-lg
                    bg-gradient-to-r from-orange-400 to-amber-400
                    hover:from-orange-500 hover:to-amber-500
                    active:scale-[0.98] transition-all duration-200
                    shadow-lg shadow-orange-300/50 hover:shadow-xl hover:shadow-orange-300/60
                    hover:-translate-y-0.5"
                  style={{ animationDelay: '0.6s' }}
                >
                  開始測驗 →
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ==================== QUIZ PAGE ====================
      if (stage === 'quiz') {
        const currentQ = QUESTIONS[step];
        const dimensionLabel = currentQ.dimension === 'EI' ? '外向 / 內向' 
          : currentQ.dimension === 'TF' ? '理性 / 感性' 
          : '計畫 / 隨性';

        return (
          <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-amber-100 flex items-center justify-center p-4">
            <div className="w-full max-w-md">
              <div className="glass-strong rounded-3xl shadow-xl shadow-orange-200/50 p-6 relative overflow-hidden">
                
                {/* Progress bar */}
                <div className="mb-6">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-sm font-medium text-stone-500">
                      第 {step + 1} / {QUESTIONS.length} 題
                    </span>
                    <span className="text-sm font-bold text-orange-500">
                      {Math.round(progress)}%
                    </span>
                  </div>
                  <div className="w-full h-2.5 bg-orange-100 rounded-full overflow-hidden">
                    <div 
                      className="h-full rounded-full progress-bar-fill"
                      style={{ width: `${progress}%` }}
                    ></div>
                  </div>
                  <div className="mt-1.5 text-right">
                    <span className="text-xs text-stone-400 bg-orange-50 px-2 py-0.5 rounded-full">
                      {dimensionLabel}
                    </span>
                  </div>
                </div>

                {/* Question card with animation */}
                <div 
                  key={step}
                  className={slideDirection === 'in' ? 'animate-slideInRight' : 'animate-slideOutLeft'}
                >
                  <div className="text-center mb-4">
                    <span className="text-5xl inline-block animate-pulse-soft">{currentQ.emoji}</span>
                  </div>

                  <h2 className="text-lg font-bold text-stone-800 text-center mb-6 leading-relaxed">
                    {currentQ.question}
                  </h2>

                  <div className="space-y-3">
                    {currentQ.options.map((opt, idx) => (
                      <button
                        key={idx}
                        id={`option-${step}-${idx}`}
                        onClick={() => handleOptionClick(opt.value)}
                        disabled={transitioning}
                        className="option-btn w-full text-left p-4 rounded-2xl
                          glass border border-white/50
                          text-stone-700 font-medium leading-relaxed
                          hover:bg-white/80 hover:border-orange-200
                          disabled:opacity-50 disabled:cursor-not-allowed
                          active:bg-orange-50"
                      >
                        <span className="inline-flex items-center gap-3">
                          <span className="flex-shrink-0 w-8 h-8 rounded-full bg-gradient-to-br from-orange-400 to-amber-400 
                            text-white text-sm font-bold flex items-center justify-center shadow-sm">
                            {String.fromCharCode(65 + idx)}
                          </span>
                          <span>{opt.text}</span>
                        </span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ==================== RESULT PAGE ====================
      if (stage === 'result' && resultKey) {
        const persona = PERSONAS[resultKey];
        if (!persona) return null;

        return (
          <div className="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-amber-100 flex items-center justify-center p-4">
            <div className="w-full max-w-md">
              <div className="glass-strong rounded-3xl shadow-xl shadow-orange-200/50 p-6 relative overflow-hidden">
                
                {/* Label */}
                <div className="text-center mb-4 animate-fadeInUp">
                  <span className="text-sm font-medium text-orange-400 tracking-widest">
                    你的靈魂創業人物是
                  </span>
                </div>

                {/* Character image */}
                <div className="relative flex justify-center mb-4 animate-bounceIn">
                  <div className="result-glow animate-breathe" style={{ top: '50%', left: '50%', transform: 'translate(-50%, -50%)' }}></div>
                  <img 
                    src={persona.image} 
                    alt={persona.name}
                    className="w-52 h-52 object-contain relative z-10 drop-shadow-2xl"
                  />
                </div>

                {/* Emoji + Name */}
                <div className="text-center mb-4 animate-fadeInUp" style={{ animationDelay: '0.2s' }}>
                  <span className="text-4xl mb-2 inline-block">{persona.emoji}</span>
                  <h2 className="text-2xl font-black text-stone-800">{persona.name}</h2>
                  <span className="text-xs text-stone-400">({resultKey})</span>
                </div>

                {/* Tags */}
                <div className="flex justify-center gap-2 mb-6 flex-wrap animate-fadeInUp" style={{ animationDelay: '0.3s' }}>
                  {persona.tags.map((tag, i) => (
                    <span 
                      key={i}
                      className="px-3 py-1 rounded-full text-sm font-medium
                        bg-gradient-to-r from-orange-100 to-amber-100 
                        text-orange-600 border border-orange-200/50"
                    >
                      #{tag}
                    </span>
                  ))}
                </div>

                {/* Strength */}
                <div className="mb-4 p-4 rounded-2xl glass border border-white/50 animate-fadeInUp" style={{ animationDelay: '0.4s' }}>
                  <h3 className="text-sm font-bold text-orange-500 mb-2 flex items-center gap-1">
                    💪 性格優勢
                  </h3>
                  <p className="text-sm text-stone-600 leading-relaxed">{persona.strength}</p>
                </div>

                {/* Social */}
                <div className="mb-6 p-4 rounded-2xl glass border border-white/50 animate-fadeInUp" style={{ animationDelay: '0.5s' }}>
                  <h3 className="text-sm font-bold text-orange-500 mb-2 flex items-center gap-1">
                    🤝 社交特質
                  </h3>
                  <p className="text-sm text-stone-600 leading-relaxed">{persona.social}</p>
                </div>

                {/* Buttons */}
                <div className="flex gap-3 animate-fadeInUp" style={{ animationDelay: '0.6s' }}>
                  <button
                    id="restart-btn"
                    onClick={resetQuiz}
                    className="flex-1 py-3.5 rounded-2xl font-bold text-stone-500
                      glass border border-stone-200/50
                      hover:bg-white/80 hover:-translate-y-0.5
                      active:scale-[0.98] transition-all duration-200"
                  >
                    🔄 重新測驗
                  </button>
                  <button
                    id="share-btn"
                    onClick={handleShare}
                    className="flex-1 py-3.5 rounded-2xl font-bold text-white
                      bg-gradient-to-r from-orange-400 to-amber-400
                      hover:from-orange-500 hover:to-amber-500
                      hover:-translate-y-0.5 active:scale-[0.98]
                      transition-all duration-200
                      shadow-lg shadow-orange-300/50"
                  >
                    {copied ? '已複製網址 ✓' : '📤 分享給朋友'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FounderLifeQuiz />);
  </script>
</body>
</html>
